<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Graphite background -->
  <rect width="32" height="32" fill="#333333"/>
  <!-- Blue Slate inner border frame -->
  <rect x="1.5" y="1.5" width="29" height="29" fill="none" stroke="#666a86" stroke-width="1.5"/>
  <!-- Powder Blue glitch ghost offset (+2px right, +2px down) -->
