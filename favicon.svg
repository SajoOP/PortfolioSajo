  <!-- Cherry Blossom main letter -->
  <text x="16.5" y="23"
        text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="23"
        fill="#edafb8">S</text>
</svg>
